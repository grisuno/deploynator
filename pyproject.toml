[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "deploynator"
dynamic = ["version"]
description = "Multi-platform deployer for GitHub, GitLab, and Bitbucket"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Gris Iscomeback"},
]
keywords = ["deploy", "semver", "release", "github", "gitlab", "bitbucket", "pypi"]
dependencies = [
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/grisuno/deploynator"
Repository = "https://github.com/grisuno/deploynator"
Documentation = "https://github.com/grisuno/deploynator"
Issues = "https://github.com/grisuno/deploynator/issues"

[project.scripts]
deploynator = "deploynator.__main__:main"
deploynator-mcp = "deploynator._mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "readmenator>=1.0",
    "build",
    "twine",
]

[tool.hatch.version]
path = "deploynator/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/deploynator",
    "/tests",
    "/specs",
    "/projects",
    "/example.deploynator.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["deploynator"]
