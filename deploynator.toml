# deploynator.toml -- deploynator self-deploy config.
# `deploynator release` / `./deploy.sh` read this. CLI flags win.

[project]
name = "deploynator"
version_file = "deploynator/__init__.py"

[tests]
commands = ["python -m pytest tests/ -q"]
timeout_s = 300
allow_no_tests = false

[docs]
auto = true
command = "python -m readmenator . --rebuild"
timeout_s = 300

[deploy]
branch = "main"
remote = "origin"

[pypi]
enabled = true
repo = "pypi"
clean_dist = true
timeout_s = 600
